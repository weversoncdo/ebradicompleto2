ça de inteligência artificial. O certificado nota 5 do MEC e chancelado pela USJT abriu portas imediatas no mercado corporativo.",tag:"Direito Digital"},{id:"4",name:"Dr. Rodrigo Fagundes",role:"Advogado Civilista e Especialista em Família",course:"Pós-Graduação em Advocacia Cível e Família",location:"Porto Alegre - RS",avatar:"https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=400&q=80",rating:5,text:"Ter aulas diretamente com nomes como Profa. Maria Helena Diniz é um privilégio que só a EBRADI oferece. A flexibilidade da plataforma digital aliada ao rigor acadêmico e aos estudos de caso reais se encaixou com perfeição na minha rotina forense diária.",tag:"Advocacia Cível"},{id:"5",name:"Dra. Juliana Mendes Silveira",role:"Advogada Trabalhista e Negociadora Coletiva",course:"Pós-Graduação em Direito & Processo do Trabalho",location:"Rio de Janeiro - RJ",avatar:"https://images.unsplash.com/photo-1580489944761-15a19d654956?auto=format&fit=crop&w=400&q=80",rating:5,text:"O curso coordenado pelo Prof. Renato Saraiva transformou a minha forma de atuar nas audiências e recursos no TRT e TST. O foco prático em cálculos rescisórios, audiências telepresenciais e estratégias de sustentação oral me deu a segurança necessária para expandir meu escritório.",tag:"Direito do Trabalho"},{id:"6",name:"Dr. Marcos Aurélio Prado",role:"Defensor Público & Especialista em Ciências Penais",course:"Pós-Graduação em Direito Penal e Criminologia",location:"Brasília - DF",avatar:"https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?auto=format&fit=crop&w=400&q=80",rating:5,text:"A profundidade doutrinária das aulas do Desembargador Guilherme Nucci e demais professores é simplesmente fantástica. O conteúdo aborda desde a investigação defensiva preliminar até teses de plenário do Júri e Habeas Corpus nos Tribunais Superiores.",tag:"Direito Penal"}],Rp=[{id:"art-1",title:"Reforma Tributária e o Novo IBS/CBS: O que muda na prática da advocacia fiscal",category:"Direito Tributário",date:"02 Mar 2025",readTime:"6 min de leitura",excerpt:"Análise detalhada das novas regras do Imposto sobre Bens e Serviços (IBS) e da Contribuição sobre Bens e Serviços (CBS), com apontamentos práticos do Prof. Ives Gandra Martins.",author:"Equipe Jurídica EBRADI",image:"https://images.unsplash.com/photo-1450133064473-71024230f91b?auto=format&fit=crop&w=600&q=80"},{id:"art-2",title:"Inteligência Artificial no Processo Civil: Validade probatória e limites éticos",category:"Direito Digital & Processo",date:"28 Fev 2025",readTime:"8 min de leitura",excerpt:"Como juízes e tribunais têm acolhido provas digitais e minutas assistidas por IA, à luz das recentes diretrizes do Conselho Nacional de Justiça (CNJ).",author:"Dra. Patricia Peck Pinheiro",image:"https://images.unsplash.com/photo-1589829545856-d10d557cf95f?auto=format&fit=crop&w=600&q=80"},{id:"art-3",title:"Checklist para a 2ª Fase OAB: Estrutura de Peça Prático-Profissional Nota 5",category:"Exame de Ordem",date:"25 Fev 2025",readTime:"5 min de leitura",excerpt:"Passo a passo definitivo para não zerar a peça e garantir a pontuação máxima no endereçamento, fundamentação jurídica e pedidos.",author:"Prof. Renato Saraiva",image:"https://images.unsplash.com/photo-1434030216411-0b793f4b4173?auto=format&fit=crop&w=600&q=80"}],Bp=[{question:"Os cursos de pós-graduação da EBRADI são reconhecidos pelo MEC?",answer:"Sim! Todos os cursos de pós-graduação lato sensu da EBRADI são certificados pela Universidade São Judas Tadeu (USJT), instituição credenciada pelo Ministério da Educação (MEC) com a Nota Máxima 5. Seu certificado possui validade nacional para títulos em concursos, progressão funcional e prática jurídica.",category:"Geral & Certificação"},{question:"Qual é a duração dos cursos de pós-graduação?",answer:"Nossos cursos possuem carga horária de 360 horas a 420 horas, podendo ser concluídos em um prazo flexível de 6 a 12 meses, conforme o seu ritmo de estudo e disponibilidade.",category:"Pós-Graduação"},{question:"Como funciona o Preparatório OAB com garantia de aprovação?",answer:"O preparatório conta com diagnóstico individual de pontos fracos, cronogramas de estudo semanais, videoaulas direcionadas aos temas estatisticamente mais cobrados pela FGV e correção individualizada de peças na 2ª fase. Se você cumprir 85% do cronograma e não for aprovado, seu acesso é renovado gratuitamente para o exame seguinte.",category:"OAB"},{question:"Posso solicitar bolsa de estudos ou desconto para ex-alunos e OAB?",answer:"Sim. A EBRADI concede descontos institucionais para inscritos na OAB, associados de sindicatos parceiros, ex-alunos da rede Ânima e candidatos que utilizarem o Simulador de Bolsas online, com descontos de até 50%.",category:"Matrícula & Bolsas"},{question:"O Trabalho de Conclusão de Curso (TCC) é obrigatório na pós-graduação?",answer:"Conforme a Resolução CNE/CES nº 01/2018 do Ministério da Educação, o TCC é optativo na grande maioria dos cursos de pós-graduação lato sensu. O aluno pode optar por realizá-lo caso deseje pontuação extra em determinados concursos públicos.",category:"Pós-Graduação"}],kp=()=>{const[g,E]=P.useState("todos"),M=g==="todos"?Xf:Xf.filter(r=>g==="tributario"?r.course.toLowerCase().includes("tributário"):g==="trabalho"?r.course.toLowerCase().includes("trabalho"):g==="civil"?r.course.toLowerCase().includes("cível"):g==="digital"?r.course.toLowerCase().includes("digital"):g==="oab"?r.tag.toLowerCase().includes("oab"):!0);return i.jsx("section",{id:"comentarios-section",className:"bg-white border-b border-slate-200",children:i.jsxs("div",{id:"comentarios-alunos",className:"w-full py-16 sm:py-24 lg:py-28 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto",children:[i.jsxs("div",{className:"text-center max-w-3xl mx-auto mb-12 sm:mb-16 space-y-4",children:[i.jsxs("div",{className:"inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-red-50 text-red-700 text-xs sm:text-sm font-bold uppercase tracking-wider border border-red-200 shadow
